# GitGuardian / ggshield configuration (format v2), kept for the GitGuardian app or a local
# ggshield run; the scanner CI runs is gitleaks (.gitleaks.toml). Both name the same exceptions
# (tests/Unit/Remediation2RepositoryHygieneTest.php compares them).
# "version: 2" is required, otherwise ggshield treats the file as the deprecated v1 format.
version: 2

secret:
  # ONE named TEST-ONLY file: tests/fixtures/vmail/seed.sql, the seed of the iRedMail vmail fixture
  # (example.com, example.org and *.test tenants), whose mailbox.password, recovery_email and
  # allow_nets columns hold canary values such as {SSHA512}SECRET-HASH-1 that are meant to look like
  # secrets - the suite proves they are never readable. Every other file, the rest of the fixture
  # directory and the E2E harness included, is scanned (a new fixture file too).
  ignored_paths:
    - 'tests/fixtures/vmail/seed.sql'

  # Ignored by EXACT value only: the throw-away values of the CI and local test environments and the
  # public fingerprint of the release signing key. The files that mention them (.github/workflows/
  # ci.yml, docs, tests) are still scanned for anything else. A new throw-away value or release key
  # must be named here and in .gitleaks.toml.
  ignored_matches:
    - name: CI service container administrator password (TEST ONLY, .github/workflows/ci.yml)
      match: ci-throwaway
    - name: read-only test role password (TEST ONLY, tests/fixtures/vmail/load.sh)
      match: testonly-ro
    - name: Dovecot E2E test mailbox password (TEST ONLY, tests/e2e/dovecot.sh)
      match: testpass
    - name: fingerprint of the release signing key (public, .github/release-signers)
      match: Dh488r7YcvACwpsZov0/TASb3v3FRjz4//bwoQCyPwU
