# GAL Bridge - continuous integration.
#
# Design notes (the decisions behind them, their owner and review date: SECURITY.md, section
# "Accepted risks and design decisions"):
# - third-party actions are pinned to full commit SHAs (tag in the comment); update both together
#   (Dependabot does, .github/dependabot.yml);
# - read-only token (permissions: contents: read), no secrets, no pull_request_target: untrusted
#   pull requests run with the same minimal rights as pushes;
# - composer.lock is git-ignored (a plugin, not an application), so every PHP version resolves its
#   own dependency set - what an installation on that PHP version gets. Every job writes the set it
#   resolved (package versions and the SHA-256 of the generated composer.lock) to its job summary
#   and "composer audit" checks it, so a run can be reproduced and reviewed afterwards;
# - Roundcube is not a runtime dependency of the plugin. GAL Bridge supports the whole 1.7 branch,
#   so the suite runs against the OLDEST release (1.7.0) and against the NEWEST 1.7.x that
#   Packagist has on the day of the run (constraint "~1.7.0"; "composer require --no-update" edits
#   composer.json on the runner only, after "composer validate"). The daily run therefore tests a
#   new patch release of the core without any change here. The advisory check is made with the
#   newest core - a security advisory against it fails the run on purpose; the 1.7.0 leg proves
#   compatibility only (its core has known advisories, which is why nobody should run it).
#   Composer (2.9 and later) by itself leaves releases with a security advisory out of the
#   dependency resolution: the pinned 1.7.0 would then not install at all, and for "~1.7.0" an
#   older release would silently replace a newest one that has an advisory. COMPOSER_NO_BLOCKING
#   switches that off for the PHPUnit job only - it installs exactly what it asks for, and
#   "composer audit" reports advisories (in the 1.7.0 legs for every package but that core). The
#   other jobs keep Composer's blocking of releases with advisories;
# - MariaDB 11.8 and PostgreSQL 17 are throw-away service containers on the job's ephemeral runner
#   and hold only the TEST-ONLY fixture (tests/fixtures/vmail). They are pinned by digest: refresh
#   tag and digest together (docs/RELEASING.md). "ci-throwaway" is their administrator password
#   (named in .gitleaks.toml and .gitguardian.yaml); the read-only role the tests connect with is
#   created by load.sh from the plugin's own SQL/grants.*.sql, so every run proves that the
#   documented grants are sufficient. The fixture is loaded with the client inside each container
#   (docker exec): client and server versions always match;
# - job "security": the history and the tree are scanned for secrets with a gitleaks release that
#   is verified by its SHA-256 before it runs (.gitleaks.toml). The static security checks of the
#   production code (no process execution, dynamic code, deserialisation or file writes; SQL in one
#   class) are part of the PHPUnit suite (tests/Unit/SourceGuardTest.php) and so run in every leg;
# - job "release" (tags only): the tag must be annotated and carry a signature that GitHub verifies,
#   it must point to a commit of main, and its version must be the one in galbridge.php and
#   CHANGELOG.md (docs/RELEASING.md). Which key may sign is not pinned here (docs/RELEASING.md).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Recheck resolved dependencies daily, even without source changes (05:23 UTC).
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }}, Roundcube ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        # the newest 1.7.x release on the day of the run ...
        core: ['~1.7.0']
        # ... and the oldest release of the supported branch
        include:
          - php: '8.1'
            core: '1.7.0'
          - php: '8.4'
            core: '1.7.0'
    env:
      CORE: ${{ matrix.core }}
      # install what is asked for; advisories are reported by "composer audit" (see the notes above)
      COMPOSER_NO_BLOCKING: '1'
    services:
      mariadb:
        image: mariadb:11.8@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc
        env:
          MARIADB_ROOT_PASSWORD: ci-throwaway
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      postgres:
        image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - '5432:5432'
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, intl, dom, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3
          coverage: none

      # The core that roundcube/plugin-installer pulls in: the oldest or the newest release of the
      # supported 1.7 branch (a runner-local edit of composer.json, never committed).
      - name: Select the Roundcube release
        run: composer require --dev --no-update --no-interaction "roundcube/roundcubemail:$CORE"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # What this leg really tested: kept with the run (job summary) for later review.
      - name: Record the resolved dependency set
        env:
          PHP_LEG: ${{ matrix.php }}
        run: |
          {
            echo "### Resolved dependencies (PHP $PHP_LEG, Roundcube constraint $CORE)"
            echo
            echo '```'
            composer show --no-interaction --format=text | awk '{ print $1, $2 }'
            echo '```'
            echo
            echo "composer.lock SHA-256: \`$(sha256sum composer.lock | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Audit this PHP version's installed packages, including dev and transitive dependencies and
      # the newest core.
      - name: Audit dependencies
        if: matrix.core != '1.7.0'
        run: composer audit --no-interaction --format=plain

      # The 1.7.0 legs: that core has advisories (fixed by later 1.7.x), every OTHER package of the
      # leg - its own dependency set - must have none.
      - name: Audit dependencies (all but the pinned 1.7.0 core)
        if: matrix.core == '1.7.0'
        run: |
          composer audit --no-interaction --format=json > "$RUNNER_TEMP/audit.json" || true
          others='[(.advisories // {}) | to_entries[] | select(.key != "roundcube/roundcubemail") | .value | length] | add // 0'
          if ! jq -e "($others) == 0" "$RUNNER_TEMP/audit.json" > /dev/null; then
            jq '(.advisories // {}) | with_entries(select(.key != "roundcube/roundcubemail"))' "$RUNNER_TEMP/audit.json" || cat "$RUNNER_TEMP/audit.json"
            exit 1
          fi

      # The git-sourced package reports "1.7-git" in its constants, so the release is verified
      # through Composer's installed metadata. logs/ and temp/ mirror a real installation.
      - name: Assemble the Roundcube directory for integration tests
        run: |
          installed="$(php -r 'require "vendor/autoload.php"; echo Composer\InstalledVersions::getPrettyVersion("roundcube/roundcubemail");')"
          echo "Roundcube $installed"
          if [ "$CORE" = '1.7.0' ]; then test "$installed" = '1.7.0'; else [[ "$installed" =~ ^1\.7\.[0-9]+$ ]]; fi
          rc="$RUNNER_TEMP/rc"
          mkdir -p "$rc/logs" "$rc/temp"
          for d in program config plugins SQL; do
            ln -s "$GITHUB_WORKSPACE/vendor/roundcube/roundcubemail/$d" "$rc/$d"
          done
          ln -s "$GITHUB_WORKSPACE/vendor" "$rc/vendor"
          test -f "$rc/program/lib/Roundcube/bootstrap.php"
          echo "GALBRIDGE_RC=$rc" >> "$GITHUB_ENV"

      # load.sh (re)creates galbridge_vmail_test on each server, loads the upstream iRedMail 1.8.11
      # schema and seed.sql, creates the read-only role from SQL/grants.*.sql and prints its DSN.
      # MYSQL_ADMIN / PSQL_ADMIN are exported for the whole job: the role tests in
      # tests/Integration/DsnPolicyTest.php create their extra roles through the same variables
      # (without them those tests are skipped, not failed).
      - name: Load the TEST-ONLY vmail fixture
        env:
          MARIADB_CID: ${{ job.services.mariadb.id }}
          POSTGRES_CID: ${{ job.services.postgres.id }}
        run: |
          export MYSQL_ADMIN="docker exec -i $MARIADB_CID mariadb -u root -pci-throwaway"
          export PSQL_ADMIN="docker exec -i -e PGPASSWORD=ci-throwaway $POSTGRES_CID psql -U postgres"
          printf 'MYSQL_ADMIN=%s\nPSQL_ADMIN=%s\n' "$MYSQL_ADMIN" "$PSQL_ADMIN" >> "$GITHUB_ENV"
          out="$RUNNER_TEMP/fixture"
          mkdir -p "$out"
          tests/fixtures/vmail/load.sh mysql | tee "$out/mysql.txt"
          tests/fixtures/vmail/load.sh pgsql | tee "$out/pgsql.txt"
          grep -h -E '^GALBRIDGE_TEST_(MYSQL|PGSQL)_DSN=(mysql|pgsql)://' "$out/mysql.txt" "$out/pgsql.txt" > "$out/dsn.env"
          # both engines or fail: a missing DSN would silently reduce the suite to the SQLite mirror
          test "$(wc -l < "$out/dsn.env")" -eq 2
          cat "$out/dsn.env" >> "$GITHUB_ENV"

      - name: PHPUnit (SQLite mirror, MariaDB 11.8, PostgreSQL 17)
        run: vendor/bin/phpunit

      - name: PHP syntax check
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null 2>&1 || { php -l "$f"; status=1; }
          done < <(find lib tests -type f -name '*.php' -print0; find localization -type f -name '*.inc' -print0; printf '%s\0' galbridge.php bin/galbridge.sh config.inc.php.dist)
          exit "$status"

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, dom, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3
          coverage: none

      # The manifest must stay valid for Packagist; validated before the CI-only pin edits it.
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock --no-interaction

      - name: Select the newest Roundcube 1.7.x
        run: composer require --dev --no-update --no-interaction "roundcube/roundcubemail:~1.7.0"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Audit the independently resolved dependency set used by PHPStan.
      - name: Audit dependencies
        run: composer audit --no-interaction --format=plain

      # phpstan.neon.dist scans Roundcube at /opt/rcrun/1.7.7 (its documented default location for a
      # tree of the supported branch); the scanned tree must be a 1.7.x release (rcube_addressbook's
      # ': void' return types). The newest one is linked there.
      - name: Assemble the Roundcube directory for analysis
        run: |
          installed="$(php -r 'require "vendor/autoload.php"; echo Composer\InstalledVersions::getPrettyVersion("roundcube/roundcubemail");')"
          echo "Roundcube $installed"
          [[ "$installed" =~ ^1\.7\.[0-9]+$ ]]
          rc="$RUNNER_TEMP/rc"
          mkdir -p "$rc"
          for d in program config plugins SQL; do
            ln -s "$GITHUB_WORKSPACE/vendor/roundcube/roundcubemail/$d" "$rc/$d"
          done
          ln -s "$GITHUB_WORKSPACE/vendor" "$rc/vendor"
          sudo mkdir -p /opt/rcrun
          sudo ln -s "$rc" /opt/rcrun/1.7.7
          echo "GALBRIDGE_RC=/opt/rcrun/1.7.7" >> "$GITHUB_ENV"

      - name: PHPStan
        run: php -d memory_limit=2G vendor/bin/phpstan analyse --no-progress -c phpstan.neon.dist

  coding-style:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same PHP version as the documented local run, so CI and developers see the same result.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, dom, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3
          coverage: none

      - name: Select the newest Roundcube 1.7.x
        run: composer require --dev --no-update --no-interaction "roundcube/roundcubemail:~1.7.0"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # This job resolves its dependencies on its own as well.
      - name: Audit dependencies
        run: composer audit --no-interaction --format=plain

      # Check only: the configured rules are not risky, but CI never rewrites code.
      - name: PHP-CS-Fixer (dry run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no --config=.php-cs-fixer.dist.php

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz as published in the release's checksums file
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # the whole history is scanned, not only the last commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (verified by its SHA-256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      # A scan that finds nothing proves nothing unless the scanner works with this configuration:
      # a key-shaped text (assembled here, so that this file holds no such text) outside the
      # allow-listed paths must be reported.
      - name: Control - a planted key is detected
        run: |
          mkdir -p "$RUNNER_TEMP/control/lib"
          {
            printf -- '-----BEGIN %s PRIVATE KEY-----\n' RSA
            head -c 480 /dev/urandom | base64 -w 64
            printf -- '-----END %s PRIVATE KEY-----\n' RSA
          } > "$RUNNER_TEMP/control/lib/planted.txt"
          if "$RUNNER_TEMP/gitleaks/gitleaks" dir --no-banner --redact --config .gitleaks.toml "$RUNNER_TEMP/control"; then
            echo "gitleaks did not report the planted key: the scan below would prove nothing" >&2
            exit 1
          fi

      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact --config .gitleaks.toml .

      - name: Scan the checked-out tree
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --no-banner --redact --config .gitleaks.toml .

  release:
    name: Release checks (signed tag, versions, archive)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the whole history: the tagged commit must be one of main (below)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The tag object is read through the API: a checkout stores an annotated tag as a plain
      # reference to its commit. "verified" is GitHub's own check of the signature against the keys
      # of the tagger's account.
      - name: The tag is annotated and its signature is verified
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          test "$type" = tag || { echo "$TAG is a lightweight tag: releases are signed, annotated tags (docs/RELEASING.md)" >&2; exit 1; }
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.verification.verified')"
          test "$verified" = true || { echo "the signature of $TAG is not verified by GitHub (docs/RELEASING.md)" >&2; exit 1; }

      # A signature that GitHub verifies proves only that SOME account signed: the tag must at least
      # name a commit that is already part of main (reviewed, pushed by the maintainers).
      - name: The tagged commit is part of main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tagged commit is not part of main (docs/RELEASING.md)" >&2; exit 1; }

      - name: The tag, the plugin and the changelog name the same version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          grep -q -F "'version' => '$version'" galbridge.php
          grep -q -F "## [$version]" CHANGELOG.md

      # .gitattributes keeps tests, CI and tooling files out of the archive that installations use
      - name: The release archive holds the plugin and nothing else
        run: |
          git archive --format=tar HEAD | tar -t > "$RUNNER_TEMP/archive.txt"
          for f in galbridge.php composer.json LICENSE README.md SECURITY.md CHANGELOG.md .htaccess config.inc.php.dist \
                   bin/galbridge.sh lib/autoload.php SQL/grants.mysql.sql SQL/grants.postgres.sql localization/en_US.inc; do
            grep -q -x -F "$f" "$RUNNER_TEMP/archive.txt" || { echo "missing in the archive: $f" >&2; exit 1; }
          done
          if grep -E '^(tests/|\.github/|\.git[a-z]+|phpunit\.xml|phpstan\.neon|\.php-cs-fixer|STAGE_|FINAL_SECURITY_REPORT|DOSTARCZONE)' "$RUNNER_TEMP/archive.txt"; then
            echo "the archive contains development or audit files" >&2
            exit 1
          fi
