# GAL Bridge - gitleaks configuration (secret scanning, .github/workflows/ci.yml job "security").
#
# The default rules of the pinned gitleaks release, plus the rule "galbridge-dsn-password" below,
# apply to the whole repository and its history. Exceptions, each as narrow as it can be (the same
# files and values as in .gitguardian.yaml; tests/Unit/Remediation2RepositoryHygieneTest.php keeps
# the two files equal and these rules exact):
#   - ONE named TEST-ONLY file, tests/fixtures/vmail/seed.sql: its canary values (password hashes
#     such as {SSHA512}SECRET-HASH-1) are meant to look like secrets - the suites prove that the
#     plugin never reads them. Every other file of tests/fixtures/vmail/ and of the E2E harness
#     (setup.sh, dovecot.sh, rc.py, load.sh) is scanned: their only credentials are the throw-away
#     values below. A NEW fixture file is scanned as well (the CI job proves it with a planted key);
#   - the throw-away values of the test environments and the CHANGE_ME_* placeholders of the grant
#     templates, by their WHOLE value;
#   - the public fingerprints of the release signing keys (.github/release-signers), which the
#     documentation must quote ("RSA key SHA256:...") and the generic rule takes for a key;
#   - git-ignored local directories (absent in CI, where job "security" installs nothing), for a
#     local "gitleaks dir ." - gitleaks applies a path exception to the history scan as well, so
#     job "security" fails first when any commit of any branch or tag ever had a file there (its
#     step "The directories the scanner skips were never committed" names the same directories).
# Every path is anchored at the top of the repository. The scan of 2026-11-25 (docs/TESTING.md)
# found nothing in history or tree that needs another exception.

title = "GAL Bridge"

[extend]
useDefault = true

# A database DSN with a password: galbridge_db_dsn in a copied configuration file, the DSN line of
# "bin/galbridge.sh grants" (its password is 40 hex digits: entropy above 3.3). Passwords of 15
# characters or fewer are not reported - the throw-away values of the test suites are that short.
[[rules]]
id = "galbridge-dsn-password"
description = "database DSN with an embedded password (galbridge_db_dsn, the DSN line of bin/galbridge.sh grants)"
regex = '''(?i)\b(?:mysql|mysqli|pgsql|postgres(?:ql)?)://[^\s:/@'"]+:([^\s@'"]{16,})@'''
secretGroup = 1
entropy = 3.0
keywords = ["mysql://", "mysqli://", "pgsql://", "postgres://", "postgresql://"]

# TEST-ONLY vmail fixture data with canary values (tests/fixtures/vmail/README.txt).
[[allowlists]]
description = "TEST-ONLY fixture seed with canary values"
paths = [
    '''^(?:\./)?tests/fixtures/vmail/seed\.sql$''',
]

# The throw-away values of the CI and local test environments and the placeholders of the templates,
# ignored by value only: the files that mention them are still scanned for anything else.
#   ci-throwaway   administrator password of the CI service containers
#   testonly-ro    password of the read-only test role (tests/fixtures/vmail/load.sh)
#   testpass       password of the Dovecot E2E test mailboxes (tests/e2e/dovecot.sh)
#   CHANGE_ME_*    placeholders of SQL/grants.*.sql and config.inc.php.dist
# A regular expression on the WHOLE secret, not a stop word: a stop word matches as a part of any
# secret, so "testpass" would also excuse a real password that merely contains those letters.
[[allowlists]]
description = "throw-away values of the test environments and template placeholders"
regexes = [
    '''^(?:ci-throwaway|testonly-ro|testpass)$''',
    '''^CHANGE_ME_[A-Z_]+$''',
]

# Fingerprints of the release signing keys (.github/release-signers): public by design, published
# in SECURITY.md, README.md, docs/INSTALLATION.md and docs/RELEASING.md. Exact values; a new key adds its own line.
[[allowlists]]
description = "public fingerprints of the release signing keys"
regexes = [
    '''^Dh488r7YcvACwpsZov0/TASb3v3FRjz4//bwoQCyPwU$''',
]

# git-ignored local directories (.gitignore), absent in CI (job "security" checks out the
# repository and installs nothing); for a local "gitleaks dir .". A committed file there would be
# hidden from the history scan too: job "security" checks that no commit ever had one, with the
# directories of this list (tests/Unit/Remediation2CiTest.php keeps the two equal).
[[allowlists]]
description = "git-ignored local run directories and tool caches"
paths = [
    '''^(?:\./)?tests/e2e/run/''',
    '''^(?:\./)?tmp/''',
    '''^(?:\./)?vendor/''',
]
